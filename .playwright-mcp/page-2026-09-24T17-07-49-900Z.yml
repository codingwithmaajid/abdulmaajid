      - paragraph [ref=f4e7]: I am a CS student from Chennai, somewhere between coursework and the real thing.
      - paragraph [ref=f4e8]: Most of what I know did not come from a classroom. It came from showing up to meetups, staying late at hackathons, reading other people's code at midnight, and slowly figuring out how systems actually hold together.
      - paragraph [ref=f4e9]: I am drawn to agents, developer tooling, and the kind of problems that only make sense after you have sat with them for a while. I build things to understand them — and then I build them again when I realise I was wrong the first time.
